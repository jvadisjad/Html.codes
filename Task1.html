<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./Task1style.css">
   
    <title>TASK</title>
</head>
<body>
    
    <div class="top-menu">
        <p>New Arrivals</p>
        <span>></span>
        <span>...</span>
        <span>></span>
        <p>Summer</p>
        <span>></span>
        <p>Short Sleeves</p>
    </div>
     <div class="product">
        <div class="image">
            <img src="./images.jpg" alt="T-shert">
        </div>
        <div class="header">
            <h1>Minimal T-shert</h1>
            <br>
            <p>1.2k reviews</p>
            <br>
            <p>Minimalist White T-shert on gray backgrond,showcasing its clean design and soft fabric texture</p>
            <p class="price">$19.99</p>
             
            <div class="sizes">
                <p><b>Size</b></p>
                
                <div class="size-buttons">
                    
                    <button>XXS</button>
                    <button>XS</button>
                    <button>S</button>
                    <button>M</button>
                    <button>L</button>
                    <button>XL</button>
                </div>

                </div>
                <br>
                <div class="colors">
                    
                    <p><b>Color</b></p>
                    
                    <div class="color-buttons">
                        <button class="white"></button>
                        <button class="black"></button>
                        <button class="blue"></button>
                        <button class="Cream"></button>
                    </div>
                    <br>
                   <div class="Quantity-buy">
                    <button>+</button>
                    <button>1</button>
                    <button>-</button>
                    <input type="button">
                  </div>
               <br>
               <div class="text-group">
                <div class="text1"><p>Composition care</p> <span>⌄</span></div>

                <div class="text2"><p>Shipping</p> <span>⌄</span></div>
                
                 <div class="text3"><p>Returns</p> <span>⌄</span></div>
            </div>

            </div>
                    
                
            

        </div>
        
        
     </div>
 
    
</body>
</html>
